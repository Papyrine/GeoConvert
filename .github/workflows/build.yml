name: Build

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

# Read only by default. The publish job asks for the OIDC token it needs itself.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Install the SDK into its own directory rather than over the runner's preinstalled one: the image's
      # shared library-packs folder carries a Microsoft.NET.Sdk.WebAssembly.Pack that fails signature
      # validation (NU3034) when restoring GeoConvert.Web.
      DOTNET_INSTALL_DIR: ${{ github.workspace }}\..\dotnet
      # SponsorCheck bundles the sponsor list during pack on non-PR builds and needs a classic PAT
      # (org secret). PR builds skip it.
      GitHubToken: ${{ secrets.SPONSOR_CHECK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Keyed on everything that decides the package graph. restore-keys lets a changed graph start
      # from the previous cache rather than empty.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/*.fsproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The tag is the version: tag 1.2.3 (or v1.2.3) builds 1.2.3. Other builds use the
      # Version in Directory.Build.props.
      - name: Resolve the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "VERSION_ARGUMENT=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        # Build the library + CLI in Release (packs GeoConvert + GeoConvert.Cli nupkgs into nugets/)
        run: dotnet build src --configuration Release ${{ env.VERSION_ARGUMENT }}

      - name: Install Coverlet
        # Coverage via Coverlet (managed IL instrumentation). The Microsoft profiler behind MTP's --coverage
        # instruments nothing on the CI image, producing an empty report; Coverlet works there.
        shell: pwsh
        run: dotnet tool install --global coverlet.console --version 10.0.1

      - name: Test with coverage
        # Run the test suite (TUnit executable) under Coverlet, emitting a trx report and Cobertura coverage.
        # Coverlet returns non-zero when the wrapped test run fails, so check $LASTEXITCODE to fail the build.
        # --include "[GeoConvert*]*" instruments only the shipped assemblies (GeoConvert, .Cli, .Skia, .ImageSharp);
        # without it the report and its console table are dominated by TUnit/Verify/Microsoft.Testing modules that
        # nothing here gates on.
        # On CI, ProjectDefaults sets ContinuousIntegrationBuild=true (GitHub Actions), so the SDK's default SourceLink
        # rewrites embedded-PDB source paths to deterministic forms that don't exist on disk. Coverlet's default
        # "MissingAll" gate would then drop every shipped module (their local source is "missing"), leaving an empty
        # report. --exclude-assemblies-without-sources None keeps those modules instrumented; --use-source-link maps
        # the deterministic paths to raw.githubusercontent URLs (which contain /src/, so coverage-check.ps1 still
        # scopes them correctly).
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          coverlet src/Tests/bin/Release/net10.0 --target dotnet --targetargs "src/Tests/bin/Release/net10.0/Tests.dll --no-ansi --no-progress --report-trx --report-trx-filename unit.trx --results-directory TestResults" --format cobertura --output TestResults/unit.cobertura.xml --include "[GeoConvert*]*" --exclude-assemblies-without-sources None --use-source-link
          if ($LASTEXITCODE -ne 0) { throw "Test run / coverage failed (exit code $LASTEXITCODE)." }

      - name: Coverage gate
        # Fail the build unless the shipped source is fully covered
        shell: pwsh
        run: ./src/coverage-check.ps1 -Report TestResults/unit.cobertura.xml -Threshold 100

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults/*.trx
            TestResults/*.cobertura.xml
          if-no-files-found: ignore

      - name: Upload received on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: received
          path: '**/*.received.*'
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload packages
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: nugets/*.nupkg
          if-no-files-found: error
          retention-days: 30

  # Trusted publishing: no stored API key. nuget.org validates GitHub's OIDC token against the
  # policy naming this repository and this workflow file, and returns a key good for an hour.
  publish:
    needs: build
    environment: nuget
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nupkgs
          path: packages

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: SimonCropp

      - name: Push to nuget.org
        run: >
          dotnet nuget push "packages/**/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
