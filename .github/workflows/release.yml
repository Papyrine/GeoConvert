name: release

on:
  push:
    tags: ['*']

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      # Lets the job mint the OIDC token nuget.org trades for a short-lived publishing key.
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      # See build.yml: avoids the runner image's library-packs NU3034 failure on GeoConvert.Web.
      DOTNET_INSTALL_DIR: ${{ github.workspace }}\..\dotnet
      # SponsorCheck bundles the sponsor list during pack on non-PR builds and needs a classic PAT
      # (org secret). Tag builds are non-PR, so it is required here.
      GitHubToken: ${{ secrets.SPONSOR_CHECK_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The tag is the version: tag 1.2.3 (or v1.2.3) publishes 1.2.3.
      - name: Resolve the version from the tag
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        # Packs the shipped packages into nugets/ (GeneratePackageOnBuild).
        run: dotnet build src --configuration Release -p:Version=${{ env.version }}

      - name: Install Coverlet
        shell: pwsh
        run: dotnet tool install --global coverlet.console --version 10.0.1

      - name: Test with coverage
        # Same invocation as build.yml; see the comments there.
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          coverlet src/Tests/bin/Release/net10.0 --target dotnet --targetargs "src/Tests/bin/Release/net10.0/Tests.dll --no-ansi --no-progress --report-trx --report-trx-filename unit.trx --results-directory TestResults" --format cobertura --output TestResults/unit.cobertura.xml --include "[GeoConvert*]*" --exclude-assemblies-without-sources None --use-source-link
          if ($LASTEXITCODE -ne 0) { throw "Test run / coverage failed (exit code $LASTEXITCODE)." }

      - name: Coverage gate
        shell: pwsh
        run: ./src/coverage-check.ps1 -Report TestResults/unit.cobertura.xml -Threshold 100

      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: received
          path: '**/*.received.*'
          if-no-files-found: ignore

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nugets
          path: nugets/*.nupkg
          if-no-files-found: error

      # Trusted publishing: no stored API key. nuget.org validates GitHub's OIDC token against the
      # policy naming this repository and this workflow file, and returns a key good for an hour,
      # so this stays immediately before the push.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: SimonCropp

      - name: Push to nuget.org
        shell: bash
        # dotnet nuget push does not expand a forward-slash wildcard on Windows, so push each file
        run: |
          for package in nugets/*.nupkg; do
            dotnet nuget push "$package" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
